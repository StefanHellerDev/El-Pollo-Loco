<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="img/3_enemies_chicken/chicken_normal/1_walk/1_w.png" />

  <title>El Pollo Loco</title>

  <link rel="stylesheet" href="./styles/standard.css">
  <link rel="stylesheet" href="./styles/assets.css">
  <link rel="stylesheet" href="./style.css">

  <script src="./classes/sounds.class.js"></script>
  <script src="./classes/drawable-object.class.js"></script>
  <script src="./classes/movable-object.class.js"></script>
  <script src="./classes/cloud.class.js"></script>
  <script src="./classes/character.class.js"></script>
  <script src="./classes/chicken.class.js"></script>
  <script src="./classes/chicken-small.class.js"></script>
  <script src="./classes/background-object.class.js"></script>
  <script src="./classes/keyboard.class.js"></script>
  <script src="./classes/level.class.js"></script>
  <script src="./classes/endboss.class.js"></script>
  <script src="./classes/status-bar-endboss.class.js"></script>
  <script src="./classes/status-bar.class.js"></script>
  <script src="./classes/bottle-bar.class.js"></script>
  <script src="./classes/coin-bar.class.js"></script>
  <script src="./classes/world.class.js"></script>
  <script src="./classes/throwable-object.class.js"></script>
  <script src="./classes/bottle.class.js"></script>
  <script src="./classes/coin.class.js"></script>
  <script src="./levels/level1.js"></script>
  <script src="./script.js" defer></script>
</head>

<body>
  <!-- <body> -->
  <h1>El Pollo Loco</h1>
  <div id="fullscreen">
    <div id="start_img_cont">
      <img class="start_img" src="./img/9_intro_outro_screens/start/startscreen_1.png">
      <div class="start_button" onclick="startGame()">Start Game!</div>
    </div>
    <button id="sound_button" onclick="toggleMute()">
      <svg fill="#000000" width="30px" height="30px" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
        <path clip-rule="evenodd"
          d="m2 7.5v3c0 .8.6 1.5 1.4 1.5h2.3l3.2 2.8c.1.1.3.2.4.2s.2 0 .3-.1c.2-.1.4-.4.4-.7v-.9l-7.2-7.2c-.5.2-.8.8-.8 1.4zm8 2v-5.8c0-.3-.1-.5-.4-.7-.1 0-.2 0-.3 0s-.3 0-.4.2l-2.8 2.5-4.1-4.1-1 1 3.4 3.4 5.6 5.6 3.6 3.6 1-1z"
          fill-rule="evenodd" />
      </svg>
    </button>
    <button id="fullscreen_button" onclick="toggleFullscreen()">
      <svg width="20px" height="20px" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M1.5 1a.5.5 0 0 0-.5.5v4a.5.5 0 0 1-1 0v-4A1.5 1.5 0 0 1 1.5 0h4a.5.5 0 0 1 0 1h-4zM10 .5a.5.5 0 0 1 .5-.5h4A1.5 1.5 0 0 1 16 1.5v4a.5.5 0 0 1-1 0v-4a.5.5 0 0 0-.5-.5h-4a.5.5 0 0 1-.5-.5zM.5 10a.5.5 0 0 1 .5.5v4a.5.5 0 0 0 .5.5h4a.5.5 0 0 1 0 1h-4A1.5 1.5 0 0 1 0 14.5v-4a.5.5 0 0 1 .5-.5zm15 0a.5.5 0 0 1 .5.5v4a1.5 1.5 0 0 1-1.5 1.5h-4a.5.5 0 0 1 0-1h4a.5.5 0 0 0 .5-.5v-4a.5.5 0 0 1 .5-.5z" />
      </svg>
    </button>

    <canvas id="canvas" width="720" height="480"></canvas>

    <div id="touch_buttons_area" class="d_none">
      <div class="arrow_buttons_area">
        <button id="button_left">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 12H18M6 12L11 7M6 12L11 17" stroke="white" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
        <button id="button_jump">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 6V18M12 6L7 11M12 6L17 11" stroke="white" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </button>
        <button id="button_right">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 12H18M18 12L13 7M18 12L13 17" stroke="white" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </button>
      </div>
      <div class="throw_button_area">
        <button id="button_throw">
          <svg width="35px" height="35px" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M0.707107 12.7071L3.29289 15.2929C3.74565 15.7456 4.35971 16 5 16C5.64029 16 6.25435 15.7456 6.70711 15.2929L11 11V8L12.5 6.5H12.5858L9.5 3.41421V3.5L8 5H5L0.707107 9.29289C0.254354 9.74565 0 10.3597 0 11C0 11.6403 0.254354 12.2544 0.707107 12.7071Z"
              fill="white" />
            <path d="M10.4571 1.54289L14.4571 5.54289L16 4L12 0L10.4571 1.54289Z" fill="white" />
          </svg>
        </button>
      </div>
    </div>


    <div id="endscreen">
      <img id="end_img" class="end_img" src="./img/9_intro_outro_screens/game_over/oh no you lost!.png">
      <button id="button_restart" onclick="restartGame()">Restart game</button>
      <button id="button_main" onclick="backToMainScreen()">Main</button>
    </div>
  </div>

  <div class="no_mobile_portrait">
    <!-- <div class="portrait_content"> -->
    <img src="./img/mobile-phone.gif" alt="" class="portrait_content_pic">
    <!-- </div> -->
  </div>
</body>

</html>
