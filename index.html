<body>
  <h1>El Pollo Loco</h1>
  <div id="fullscreen">
    <div id="start_img_cont">
      <img class="start_img" src="./img/9_intro_outro_screens/start/startscreen_1.png">
      <div class="start_button" onclick="startGame()">Start Game!</div>
      <button id="information">
        <p>Game info and imprint</p>
      </button>

    </div>

    </button>
    <button id="fullscreen_button" onclick="toggleFullscreen()">
      <svg width="20px" height="20px" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M1.5 1a.5.5 0 0 0-.5.5v4a.5.5 0 0 1-1 0v-4A1.5 1.5 0 0 1 1.5 0h4a.5.5 0 0 1 0 1h-4zM10 .5a.5.5 0 0 1 .5-.5h4A1.5 1.5 0 0 1 16 1.5v4a.5.5 0 0 1-1 0v-4a.5.5 0 0 0-.5-.5h-4a.5.5 0 0 1-.5-.5zM.5 10a.5.5 0 0 1 .5.5v4a.5.5 0 0 0 .5.5h4a.5.5 0 0 1 0 1h-4A1.5 1.5 0 0 1 0 14.5v-4a.5.5 0 0 1 .5-.5zm15 0a.5.5 0 0 1 .5.5v4a1.5 1.5 0 0 1-1.5 1.5h-4a.5.5 0 0 1 0-1h4a.5.5 0 0 0 .5-.5v-4a.5.5 0 0 1 .5-.5z" />
      </svg>
    </button>

    <canvas id="canvas" width="720" height="480"></canvas>

    <div id="touch_buttons_area" class="touch_buttons_area d_none">

      <div class="arrow_buttons_area">
        <button id="button_left">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 12H18M6 12L11 7M6 12L11 17" stroke="white" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
        <button id="button_right">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 12H18M18 12L13 7M18 12L13 17" stroke="white" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </button>
      </div>

      <div class="throw_button_area">
        <button id="button_throw">
          <svg width="35px" height="35px" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M0.707107 12.7071L3.29289 15.2929C3.74565 15.7456 4.35971 16 5 16C5.64029 16 6.25435 15.7456 6.70711 15.2929L11 11V8L12.5 6.5H12.5858L9.5 3.41421V3.5L8 5H5L0.707107 9.29289C0.254354 9.74565 0 10.3597 0 11C0 11.6403 0.254354 12.2544 0.707107 12.7071Z"
              fill="white" />
            <path d="M10.4571 1.54289L14.4571 5.54289L16 4L12 0L10.4571 1.54289Z" fill="white" />
          </svg>
        </button>

        <button id="button_jump">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 6V18M12 6L7 11M12 6L17 11" stroke="white" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </button>
      </div>

    </div>

    <div id="endscreen">
      <img id="end_img" class="end_img" src="./img/9_intro_outro_screens/game_over/oh no you lost!.png">
      <button id="button_restart" onclick="restartGame()">Restart game</button>
      <button id="button_main" onclick="backToMainScreen()">Main</button>
    </div>
  </div>

  <div id="modal" class="modal-overlay">
    <div class="modal-box">
      <button id="closeBtn" class="modal-close">×</button>
      <h2>Game info</h2>
      <p>Help Pepe survive the desert!</p>
      <p>Use these controls:</p><br>
      <table>
        <tr>
          <td class="left_td">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M6 12H18M6 12L11 7M6 12L11 17" stroke="white" stroke-width="2" stroke-linecap="round" />
            </svg>
          </td>
          <td class="right_td">Left</td>
        </tr>
        <tr>
          <td class="left_td">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 6V18M12 6L7 11M12 6L17 11" stroke="white" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" />
            </svg>
            <span class="black">or</span>
            <svg fill="#FFF" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M21,9a1,1,0,0,0-1,1v3H4V10a1,1,0,0,0-2,0v4a1,1,0,0,0,1,1H21a1,1,0,0,0,1-1V10A1,1,0,0,0,21,9Z" />
            </svg>
          </td>
          <td class="right_td">Jump</td>
        </tr>
        <tr>
          <td class="left_td">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M6 12H18M18 12L13 7M18 12L13 17" stroke="white" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" />
            </svg>
          </td>
          <td class="right_td">Right</td>
        </tr>
        <tr>
          <td class="left_td">D</td>
          <td class="right_td">Throw bottle</td>
        </tr>
      </table>
      <h2>Imprint</h2>
      <div class="imprint">
        <p>Stefan Heller</p>
        <p>Weddinger Weg 3</p>
        <p>48455 Bad Bentheim</p>
        <p>Germany</p><br>
        <h3>Contact</h3>
        <p>Telephone: +49 176 20421494</p>
        <p>Email: S_Heller@gmx.de</p>
      </div>
    </div>
  </div>

  <div class="no_mobile_portrait">
    <img src="./img/mobile-phone.gif" alt="" class="portrait_content_pic">
  </div>
</body>

</html>
